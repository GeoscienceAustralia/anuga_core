[project]
scenario               = "Towradgi_historic_flood"
output_base_directory  = "OUTPUT/"
yieldstep              = "3*60"
starttime              = "-3*3600"   # 3 h burn-in; the rain starts at t = 0
finaltime              = "24*3600"
outputstep             = "15*60"
projection_information = "EPSG:32756"
flow_algorithm         = "DE1"
compute_mode           = "unified"  # "legacy" (CPU OpenMP) or "unified" (CPU/GPU)
report_mass_conservation_statistics = true  # water balance each yieldstep

[mesh]
bounding_polygon    = "bounding_polygon.csv"
default_res         = 1000.0
riverwall_csv_files = ["Model/Riverwalls/*.csv"]
[[mesh.boundary_tags]]
tag = "south"
edges = [0]
[[mesh.boundary_tags]]
tag = "east"
edges = [1]
[[mesh.boundary_tags]]
tag = "north"
edges = [2]
[[mesh.boundary_tags]]
tag = "west"
edges = [3]
[[mesh.interior_regions]]
polygon    = "Model/Bdy/Catchment.csv"
resolution = 100.0
[[mesh.interior_regions]]
polygon    = "Model/Bdy/FineCatchment.csv"
resolution = 36.0
[[mesh.interior_regions]]
polygon    = "Model/Bdy/CreekBanks.csv"
resolution = 8.0

[boundary_conditions]
[[boundary_conditions.boundaries]]
tag  = "west"
type = "Reflective"
[[boundary_conditions.boundaries]]
tag  = "south"
type = "Reflective"
[[boundary_conditions.boundaries]]
tag  = "north"
type = "Reflective"
[[boundary_conditions.boundaries]]
tag        = "east"
type       = "Stage"           # Transmissive_n_momentum_zero_t_momentum_set_stage
file       = "east_stage.csv"  # constant stage 0.0
start_time = 0.0

[initial_conditions]
[[initial_conditions.elevation]]
polygon = "All"
value   = "DEM_bridges/towradgi.npy"   # x,y,z point cloud, nearest-neighbour
[[initial_conditions.stage]]
polygon = "All"
value   = 0.0
[[initial_conditions.xmomentum]]
polygon = "All"
value   = 0.0
[[initial_conditions.ymomentum]]
polygon = "All"
value   = 0.0
