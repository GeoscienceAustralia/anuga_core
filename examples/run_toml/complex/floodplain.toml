# =============================================================================
# A "Cairns-like" anuga_toml_run scenario, scaled down to run anywhere.
# =============================================================================
#
# A 400 m x 200 m plain that slopes from 3 m in the west down to 0 m at the
# eastern outlet.  It exercises most of the features the full Cairns example
# uses, but every input is a small CSV generated by make_inputs.py — no DEMs,
# shapefiles or external datasets:
#
#   * elevation from an x,y,z point file (a sloped bed)
#   * an interior region with a finer mesh resolution
#   * an inlet hydrograph (discharge timeseries injected across a line)
#   * spatially uniform rainfall (a timeseries over the whole domain)
#   * a prescribed-stage (transmissive) outlet boundary, reflective walls
#   * evolve-loop diagnostics via a user_functions.py module
#
# Regenerate the input CSVs (optional — they are committed):
#     python make_inputs.py
#
# Run it (serial):
#     anuga_toml_run floodplain.toml
#
# Run it (parallel, 4 processes):
#     mpiexec -np 4 anuga_toml_run floodplain.toml
#
# For a full real-world dataset (DEM raster, boundary shapefile, structures),
# see ../../cairns_toml_excel/cairns_example.toml.


# -----------------------------------------------------------------------------
[project]
# -----------------------------------------------------------------------------
scenario               = "floodplain"
output_base_directory  = "OUTPUT/"
yieldstep              = 60.0            # SWW output cadence [s]
finaltime              = 1200.0          # 20 minutes of simulated time
projection_information = -56             # UTM zone 56 south (metadata only here)
flow_algorithm         = "DE1"

# Evolve-loop diagnostics.  The peak-velocity and operator reports call hooks in
# user_functions.py (sitting alongside this file); set them false to silence.
report_mass_conservation_statistics = true
report_peak_velocity_statistics     = true
report_operator_statistics          = true

# Threads / device.  Omit omp_num_threads to honour $OMP_NUM_THREADS.
# compute_mode = "legacy"   # "legacy" (CPU OpenMP, default) or "unified" (CPU/GPU)
# omp_num_threads     = 4


# -----------------------------------------------------------------------------
[mesh]
# -----------------------------------------------------------------------------
bounding_polygon = "bounding_polygon.csv"
default_res      = 200.0                  # coarse background triangles [m^2]

# Edge -> tag map for the rectangular bounding polygon:
#   0: south   1: east (outlet)   2: north   3: west
[[mesh.boundary_tags]]
tag = "south"
edges = [0]
[[mesh.boundary_tags]]
tag = "east"
edges = [1]
[[mesh.boundary_tags]]
tag = "north"
edges = [2]
[[mesh.boundary_tags]]
tag = "west"
edges = [3]

# Refine the central band where the flow concentrates (smaller triangle area).
# interior_regions are mutually exclusive with breaklines / region_areas_file.
[[mesh.interior_regions]]
polygon    = "refine_channel.csv"
resolution = 50.0


# -----------------------------------------------------------------------------
[boundary_conditions]
# -----------------------------------------------------------------------------
# Walls on three sides; the east edge is a prescribed-stage outlet that lets
# water drain out.  "Stage" is the GPU-friendly transmissive-normal /
# zero-tangential / set-stage boundary, driven by the stage timeseries file.
[[boundary_conditions.boundaries]]
tag  = "west"
type = "Reflective"
[[boundary_conditions.boundaries]]
tag  = "north"
type = "Reflective"
[[boundary_conditions.boundaries]]
tag  = "south"
type = "Reflective"
[[boundary_conditions.boundaries]]
tag        = "east"
type       = "Stage"
file       = "downstream_stage.csv"
start_time = 0.0


# -----------------------------------------------------------------------------
[initial_conditions]
# -----------------------------------------------------------------------------
# Sloped bed from the x,y,z point file (nearest-neighbour interpolated).
[[initial_conditions.elevation]]
polygon = "Extent"
value   = "elevation.csv"
[[initial_conditions.elevation]]
polygon = "All"
value   = 0.0

[[initial_conditions.friction]]
polygon = "All"
value   = 0.03

# Start essentially dry: stage below the bed everywhere except the outlet edge.
[[initial_conditions.stage]]
polygon = "All"
value   = 0.0

[[initial_conditions.xmomentum]]
polygon = "All"
value   = 0.0
[[initial_conditions.ymomentum]]
polygon = "All"
value   = 0.0


# -----------------------------------------------------------------------------
# Inlets — discharge injected across a cross-section line
# -----------------------------------------------------------------------------
[[inlets]]
name            = "west_inflow"
line_file       = "inlet_line.csv"
timeseries_file = "inlet_hydrograph.csv"
start_time      = 0.0


# -----------------------------------------------------------------------------
# Rainfall — spatially uniform rate over the whole domain
# -----------------------------------------------------------------------------
[[rainfall]]
timeseries_file    = "rain.csv"
start_time         = 0.0
interpolation_type = "linear"
polygon            = "All"
multiplier         = 1.0
