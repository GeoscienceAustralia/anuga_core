name: anuga_env_3.12
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - affine
  - cartopy
  - contextily
  - cython
  - dill
  - rasterio
  - fiona
  - shapely
  # Pin libjxl to the soname libgdal-core is built against (0.11): a fresh
  # conda-forge solve otherwise omits libjxl on Linux/macOS and GDAL fails
  # at import with 'libjxl.so.0.11: cannot open shared object file'.
  - libjxl <0.12
  - matplotlib
  - meshpy
  - meson
  - meson-python
  - netcdf4
  - ninja
  - numpy
  - openpyxl
  - pandas
  - pkg-config
  - pybind11
  - pymetis
  - pyproj
  - pytest
  - pytest-regressions
  - scipy
  - sympy
  - utm
  - wheel
  - xarray
  - pip:
    - pmw
